name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - node-version: 18
            development-runtime: false
          - node-version: 20
            development-runtime: false
          - node-version: 22.23.1
            development-runtime: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use the repository npm version
        run: (cd "$RUNNER_TEMP" && npm install --global npm@10.9.3)

      - name: Install dependencies
        run: |
          if [ "${{ matrix.development-runtime }}" = "true" ]; then
            npm ci
          else
            npm ci --force
          fi

      - name: Validate the development toolchain
        if: matrix.development-runtime
        run: npm run check:node && npm run lint && npm run typecheck

      - name: Test with coverage
        run: |
          if [ "${{ matrix.development-runtime }}" = "true" ]; then
            npm test
          else
            npm --force test
          fi

      - name: Build package
        run: |
          if [ "${{ matrix.development-runtime }}" = "true" ]; then
            npm run build
          else
            npm --force run build
          fi
